name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: meridian
            asset_name: meridian-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: meridian
            asset_name: meridian-mac-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: meridian
            asset_name: meridian-mac-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: meridian.exe
            asset_name: meridian-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Rename Asset (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}
          chmod +x ./${{ matrix.asset_name }}
          
      - name: Rename Asset (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} .\${{ matrix.asset_name }}
          
      - name: Upload to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./${{ matrix.asset_name }} --clobber --repo ${{ github.repository }}
        
      - name: Upload to Release (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.inputs.tag }} ./${{ matrix.asset_name }} --clobber --repo ${{ github.repository }}
