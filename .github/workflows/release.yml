name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: meridian
            asset_name: meridian-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: meridian
            asset_name: meridian-mac-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: meridian
            asset_name: meridian-mac-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: meridian.exe
            asset_name: meridian-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Rename Asset
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x ./${{ matrix.asset_name }}
          fi
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
          files: ./${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
