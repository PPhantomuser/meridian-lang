[workspace]
members = [
    "ast",
    "cli",
    "diagnostics",
    "lexer",
    "parser",
    "semantic",
    "ir",
    "vm",
    "runtime",
    "stdlib",
    "fmt",
    "backend-cranelift",
    "lsp", "lint",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"
semver = "1.0"
sha2 = "0.10"
hex = "0.4"
